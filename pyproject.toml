[project]
name = "python-anything"
version = "0.1.0"
description = "Python project starter with a modern setup"
license = "MIT"
authors = [
    { name = "Ülgen Sarıkavak", email = "foss@ulgenwanders.net" },
]
requires-python = "==3.15.*"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "copier-template-extensions==0.3.4",
]

[dependency-groups]
dev = [
    "copier==9.18.2",
    "httpx==0.28.1",
    "ipdb==0.13.13",
    "ipython==9.17.1",
    # Having ruff in the venv helps with IDE's auto lint/format integrations
    "ruff==0.17.0",
    { include-group = "test" },
]
test = [
    "faker==40.43.0",
    "pytest==9.1.1",
    "pytest-randomly==5.0.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
# The earliest version that supports the current lock file revision (5)
required-version = ">=0.12.22"
package = false
